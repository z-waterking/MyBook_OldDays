name: Site integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile scripts/*.py

      - name: Check Node.js syntax
        run: for file in scripts/*.mjs; do node --check "$file"; done

      - name: Check generated indexes
        run: |
          python scripts/save_article.py --catalog-only
          node scripts/generate_image_index.mjs
          git diff --exit-code -- website/catalog.md website/image-index.md

      - name: Check generated book manuscript
        run: |
          python scripts/build_book_manuscript.py
          python scripts/build_book_manuscript.py --check
          git diff --exit-code -- book/manuscript.md

      - name: Check site integrity
        run: python scripts/check_site.py