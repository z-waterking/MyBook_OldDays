name: Site integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image validation dependency
        run: python -m pip install "Pillow>=10.0.0"

      - name: Check Python syntax
        run: python -m py_compile scripts/save_article.py scripts/check_site.py

      - name: Check site integrity
        run: python scripts/check_site.py