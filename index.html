<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>旧日之书</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #5a4a3a;
    }

    body {
      background: #fafaf8;
      color: #2d2d2d;
    }

    /* 正文 */
    .markdown-section {
      max-width: 860px !important;
      font-size: 18px !important;
      line-height: 2 !important;
      color: #2d2d2d !important;
    }

    .markdown-section p {
      margin: 0 0 1.3em;
    }

    /* 标题 */
    .markdown-section h1 {
      font-size: 2em !important;
      font-weight: 700 !important;
      margin: 1em 0 0.6em !important;
      padding-bottom: 12px !important;
      border-bottom: 2px solid #e0ddd8 !important;
    }

    .markdown-section h2 {
      font-size: 1.5em !important;
      font-weight: 600 !important;
      margin: 2em 0 0.7em !important;
      padding-bottom: 8px !important;
      border-bottom: 1px solid #e8e6e2 !important;
    }

    .markdown-section h3 {
      font-size: 1.2em !important;
      font-weight: 600 !important;
      margin: 1.6em 0 0.5em !important;
    }

    /* 链接 */
    .markdown-section a {
      color: #5a4a3a !important;
      text-decoration: underline !important;
      text-underline-offset: 3px;
    }

    .markdown-section a:hover {
      color: #8b6914 !important;
    }

    /* 引用块 — 简洁卡片 */
    .markdown-section blockquote {
      background: #f4f2ee !important;
      border: none !important;
      border-left: 3px solid #c0b89e !important;
      border-radius: 0 6px 6px 0 !important;
      padding: 20px 24px !important;
      margin: 1.4em 0 !important;
      font-size: 17px !important;
      line-height: 1.9 !important;
    }

    .markdown-section blockquote p {
      margin: 0 0 0.5em !important;
      color: #3a3a3a !important;
    }

    .markdown-section blockquote p:last-child {
      margin-bottom: 0 !important;
    }

    /* 分割线 */
    .markdown-section hr {
      border: none !important;
      border-top: 1px solid #e0ddd8 !important;
      margin: 2.5em 0 !important;
    }

    /* 表格 */
    .markdown-section table {
      font-size: 16px !important;
    }

    .markdown-section table thead th {
      background: #f0eeea !important;
      font-weight: 600 !important;
    }

    .markdown-section table tbody tr:hover {
      background: #f7f6f3 !important;
    }

    /* 图片 */
    .markdown-section img {
      border-radius: 4px;
      max-width: 100%;
    }

    .markdown-section .article-cover {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      margin: 12px 0 28px;
      border-radius: 6px;
    }

    .article-cover-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin: 18px 0 30px;
    }

    .article-cover-group {
      margin: 24px 0 34px;
    }

    .article-cover-group h2 {
      margin: 0 0 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e8e2d6;
      font-size: 20px;
      line-height: 1.35;
      color: #2d2d2d;
    }

    .article-cover-group h2 small {
      margin-left: 8px;
      font-size: 13px;
      font-weight: 400;
      color: #888;
    }

    .article-cover-group .article-cover-list {
      margin: 0;
    }

    .article-cover-row {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      padding: 10px 0;
      color: inherit !important;
      text-decoration: none !important;
      border-bottom: 1px solid #eeeae2;
    }

    .article-cover-row:hover .article-cover-title strong {
      color: #8b6914;
    }

    .article-cover-thumb {
      display: block;
      width: 112px;
      color: inherit !important;
      text-decoration: none !important;
    }

    .article-cover-thumb img {
      width: 112px;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      border-radius: 6px;
      display: block;
      margin: 0;
      background: #eeeae2;
    }

    .article-cover-title {
      display: block;
      color: inherit !important;
      text-decoration: none !important;
    }

    .article-cover-info {
      display: block;
      min-width: 0;
    }

    .article-cover-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .article-cover-main {
      display: block;
      min-width: 0;
      flex: 1 1 auto;
    }

    .article-cover-info strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 600;
      color: #2d2d2d;
    }

    .article-cover-info em {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      font-style: normal;
      color: #777;
    }

    .article-cover-excerpt {
      display: -webkit-box;
      margin-top: 6px;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-size: 14px;
      line-height: 1.7;
      color: #666;
    }

    .article-cover-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
      flex: 0 1 48%;
      margin-top: 0;
      line-height: 1.4;
    }

    .article-cover-actions a {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 1px 7px;
      border: 1px solid #e4ded1;
      border-radius: 4px;
      background: #faf8f3;
      color: #6b5a42 !important;
      font-size: 12px;
      text-decoration: none !important;
    }

    .article-cover-actions a:hover {
      border-color: #cfc4ad;
      background: #f2ecdf;
      color: #2d2d2d !important;
    }

    /* 侧边栏 */
    .sidebar {
      background: #f5f4f1 !important;
      border-right: 1px solid #e8e6e2 !important;
    }

    .sidebar li > a {
      color: #555 !important;
      font-size: 14px !important;
    }

    .sidebar li > a:hover,
    .sidebar li.active > a {
      color: #2d2d2d !important;
      font-weight: 600 !important;
    }

    /* 手机端字号不缩 */
    @media (max-width: 768px) {
      .markdown-section {
        font-size: 17px !important;
      }

      .article-cover-list {
        gap: 0;
      }

      .article-cover-group {
        margin: 20px 0 28px;
      }

      .article-cover-group h2 {
        font-size: 18px;
      }

      .article-cover-row {
        grid-template-columns: 86px minmax(0, 1fr);
        gap: 10px;
        padding: 9px 0;
      }

      .article-cover-thumb,
      .article-cover-thumb img {
        width: 86px;
      }

      .article-cover-info strong {
        font-size: 14px;
      }

      .article-cover-head {
        flex-direction: column;
        gap: 5px;
      }

      .article-cover-info em {
        font-size: 12px;
      }

      .article-cover-excerpt {
        margin-top: 4px;
        font-size: 13px;
        line-height: 1.55;
      }

      .article-cover-actions {
        justify-content: flex-start;
        flex-basis: auto;
        gap: 4px;
      }

      .article-cover-actions a {
        min-height: 20px;
        padding: 1px 6px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: '旧日之书',
      repo: 'https://github.com/z-waterking/MyBook_OldDays',
      loadSidebar: true,
      loadNavbar: false,
      homepage: 'catalog.md',
      subMaxLevel: 2,
      search: {
        placeholder: '搜索文章...',
        noData: '没有找到结果',
        depth: 3
      },
      auto2top: true,
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
