<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>旧日之书</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #5a4a3a;
    }

    body {
      background: #fafaf8;
      color: #2d2d2d;
    }

    /* 正文 */
    .markdown-section {
      max-width: 860px !important;
      font-size: 18px !important;
      line-height: 2 !important;
      color: #2d2d2d !important;
    }

    .markdown-section p {
      margin: 0 0 1.3em;
    }

    /* 标题 */
    .markdown-section h1 {
      font-size: 2em !important;
      font-weight: 700 !important;
      margin: 1em 0 0.6em !important;
      padding-bottom: 12px !important;
      border-bottom: 2px solid #e0ddd8 !important;
    }

    .markdown-section h2 {
      font-size: 1.5em !important;
      font-weight: 600 !important;
      margin: 2em 0 0.7em !important;
      padding-bottom: 8px !important;
      border-bottom: 1px solid #e8e6e2 !important;
    }

    .markdown-section h3 {
      font-size: 1.2em !important;
      font-weight: 600 !important;
      margin: 1.6em 0 0.5em !important;
    }

    /* 链接 */
    .markdown-section a {
      color: #5a4a3a !important;
      text-decoration: underline !important;
      text-underline-offset: 3px;
    }

    .markdown-section a:hover {
      color: #8b6914 !important;
    }

    /* 引用块 — 简洁卡片 */
    .markdown-section blockquote {
      background: #f4f2ee !important;
      border: none !important;
      border-left: 3px solid #c0b89e !important;
      border-radius: 0 6px 6px 0 !important;
      padding: 20px 24px !important;
      margin: 1.4em 0 !important;
      font-size: 17px !important;
      line-height: 1.9 !important;
    }

    .markdown-section blockquote p {
      margin: 0 0 0.5em !important;
      color: #3a3a3a !important;
    }

    .markdown-section blockquote p:last-child {
      margin-bottom: 0 !important;
    }

    /* 分割线 */
    .markdown-section hr {
      border: none !important;
      border-top: 1px solid #e0ddd8 !important;
      margin: 2.5em 0 !important;
    }

    /* 表格 */
    .markdown-section table {
      font-size: 16px !important;
    }

    .markdown-section table thead th {
      background: #f0eeea !important;
      font-weight: 600 !important;
    }

    .markdown-section table tbody tr:hover {
      background: #f7f6f3 !important;
    }

    /* 图片 */
    .markdown-section img {
      border-radius: 4px;
      max-width: 100%;
    }

    .markdown-section .article-cover {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      margin: 12px 0 28px;
      border-radius: 6px;
    }

    .article-cover-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin: 18px 0 30px;
    }

    .article-cover-group {
      margin: 24px 0 34px;
    }

    .article-cover-group h2 {
      margin: 0 0 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e8e2d6;
      font-size: 20px;
      line-height: 1.35;
      color: #2d2d2d;
    }

    .article-cover-group h2 small {
      margin-left: 8px;
      font-size: 13px;
      font-weight: 400;
      color: #888;
    }

    .article-cover-group .article-cover-list {
      margin: 0;
    }

    .article-cover-row {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      padding: 10px 0;
      color: inherit !important;
      text-decoration: none !important;
      border-bottom: 1px solid #eeeae2;
    }

    .article-cover-row:hover .article-cover-title strong {
      color: #8b6914;
    }

    .article-cover-thumb {
      display: block;
      width: 112px;
      color: inherit !important;
      text-decoration: none !important;
    }

    .article-cover-thumb img {
      width: 112px;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      border-radius: 6px;
      display: block;
      margin: 0;
      background: #eeeae2;
    }

    .article-cover-title {
      display: block;
      color: inherit !important;
      text-decoration: none !important;
    }

    .article-cover-info {
      display: block;
      min-width: 0;
    }

    .article-cover-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .article-cover-main {
      display: block;
      min-width: 0;
      flex: 1 1 auto;
    }

    .article-cover-info strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 600;
      color: #2d2d2d;
    }

    .article-cover-info em {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      font-style: normal;
      color: #777;
    }

    .article-cover-excerpt {
      display: -webkit-box;
      margin-top: 6px;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      font-size: 14px;
      line-height: 1.7;
      color: #666;
    }

    .article-cover-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
      flex: 0 1 48%;
      margin-top: 0;
      line-height: 1.4;
    }

    .article-cover-actions a {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 1px 7px;
      border: 1px solid #e4ded1;
      border-radius: 4px;
      background: #faf8f3;
      color: #6b5a42 !important;
      font-size: 12px;
      text-decoration: none !important;
    }

    .article-cover-actions a:hover {
      border-color: #cfc4ad;
      background: #f2ecdf;
      color: #2d2d2d !important;
    }

    /* 侧边栏 */
    .sidebar {
      background: linear-gradient(180deg, #f8f6f0 0%, #f1efe8 100%) !important;
      border-right: 1px solid #e2dccf !important;
      color: #3a332a !important;
    }

    .sidebar h1.app-name {
      margin: 18px 16px 10px !important;
      padding-bottom: 12px !important;
      border-bottom: 1px solid #ded7ca !important;
      font-size: 22px !important;
      line-height: 1.25 !important;
      text-align: left !important;
    }

    .sidebar h1.app-name a {
      color: #2d261d !important;
      font-weight: 700 !important;
      text-decoration: none !important;
    }

    .sidebar .search {
      margin: 0 14px 14px !important;
      padding: 0 0 12px !important;
      border-bottom: 1px solid #e5ded2 !important;
    }

    .sidebar .search input {
      width: 100% !important;
      height: 34px !important;
      padding: 0 10px !important;
      border: 1px solid #d8cfbf !important;
      border-radius: 6px !important;
      background: #fffdf8 !important;
      color: #2d2d2d !important;
      font-size: 13px !important;
    }

    .sidebar-nav {
      padding: 0 12px 28px !important;
    }

    .sidebar-nav ul,
    .sidebar-nav li {
      margin: 0 !important;
      list-style: none !important;
    }

    .sidebar-nav > ul > li {
      margin: 0 0 2px !important;
    }

    .sidebar-nav > ul > li > p {
      margin: 0 !important;
    }

    .sidebar-nav > ul > li > p > a {
      display: flex !important;
      align-items: center !important;
      min-height: 30px !important;
      padding: 4px 9px !important;
      border-radius: 6px !important;
      color: #4b4033 !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      line-height: 1.35 !important;
      text-decoration: none !important;
    }

    .sidebar-nav > ul > li > p > a:hover,
    .sidebar-nav > ul > li.active > p > a {
      background: #e9e1d2 !important;
      color: #241d16 !important;
    }

    .sidebar-nav > ul > li > p > strong {
      display: block !important;
      color: #8a7558 !important;
      font-size: 12px !important;
      font-weight: 700 !important;
      line-height: 1.35 !important;
    }

    .sidebar-nav > ul > li.sidebar-branch {
      margin-top: 12px !important;
    }

    .sidebar-nav > ul > li.sidebar-branch > p.sidebar-branch-toggle {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 8px !important;
      min-height: 30px !important;
      margin: 0 0 4px !important;
      padding: 5px 8px !important;
      border: 1px solid #e0d7c8 !important;
      border-radius: 7px !important;
      background: #f7f2e8 !important;
      cursor: pointer !important;
      user-select: none !important;
    }

    .sidebar-nav > ul > li.sidebar-branch > p.sidebar-branch-toggle::after {
      content: "▾" !important;
      width: 14px !important;
      margin-right: 1px !important;
      color: #8a7558 !important;
      font-size: 13px !important;
      line-height: 1 !important;
      text-align: center !important;
      transform: none !important;
      transition: transform 0.16s ease !important;
      flex: 0 0 auto !important;
    }

    .sidebar-nav > ul > li.sidebar-branch.is-collapsed > p.sidebar-branch-toggle::after {
      content: "▸" !important;
      transform: none !important;
    }

    .sidebar-nav > ul > li.sidebar-branch > ul {
      margin: 0 0 8px 8px !important;
      padding: 4px 0 6px 8px !important;
      border-left: 1px solid #d8cfbf !important;
    }

    .sidebar-nav > ul > li.sidebar-branch.sidebar-maintenance {
      margin-top: 22px !important;
      padding-top: 12px !important;
      border-top: 1px dashed #d7cdbb !important;
    }

    .sidebar-nav > ul > li.sidebar-branch.sidebar-maintenance > p.sidebar-branch-toggle {
      min-height: 26px !important;
      padding: 3px 7px !important;
      border-color: transparent !important;
      background: transparent !important;
    }

    .sidebar-nav > ul > li.sidebar-branch.sidebar-maintenance > p.sidebar-branch-toggle > strong {
      color: #9a8b78 !important;
      font-size: 11px !important;
      letter-spacing: 0.04em !important;
    }

    .sidebar-nav > ul > li.sidebar-branch.sidebar-maintenance > ul {
      margin-left: 4px !important;
      padding-left: 8px !important;
      border-left-style: dashed !important;
      border-left-color: #ded5c8 !important;
    }

    .sidebar-nav > ul > li.sidebar-branch.sidebar-maintenance > ul > li > a {
      color: #8a7f72 !important;
      font-size: 12px !important;
    }

    .sidebar-nav > ul > li.sidebar-branch.is-collapsed > ul {
      display: none !important;
    }

    .sidebar-nav > ul > li > ul {
      padding: 0 0 6px !important;
    }

    .sidebar-nav > ul > li > ul > li > a {
      display: block !important;
      min-height: 27px !important;
      padding: 4px 8px 4px 12px !important;
      border-radius: 5px !important;
      color: #5b5147 !important;
      font-size: 13px !important;
      line-height: 1.5 !important;
      text-decoration: none !important;
    }

    .sidebar-nav > ul > li > ul > li > a:hover,
    .sidebar-nav > ul > li > ul > li.active > a {
      background: #ebe5d9 !important;
      color: #2d261d !important;
      font-weight: 600 !important;
    }

    .sidebar-nav li.sidebar-page-branch > a,
    .sidebar-nav li.sidebar-page-branch > p > a {
      position: relative !important;
      padding-right: 24px !important;
    }

    .sidebar-nav li.sidebar-page-branch > a::after,
    .sidebar-nav li.sidebar-page-branch > p > a::after {
      content: "▾" !important;
      position: absolute !important;
      top: 50% !important;
      right: 9px !important;
      width: 14px !important;
      color: currentColor !important;
      font-size: 13px !important;
      line-height: 1 !important;
      text-align: center !important;
      transform: translateY(-50%) !important;
    }

    .sidebar-nav li.sidebar-page-branch.is-collapsed > a::after,
    .sidebar-nav li.sidebar-page-branch.is-collapsed > p > a::after {
      content: "▸" !important;
      transform: translateY(-50%) !important;
    }

    .sidebar-nav .app-sub-sidebar {
      margin: 3px 0 8px 10px !important;
      padding: 3px 0 4px 8px !important;
      border-left: 1px dashed #d8cfbf !important;
    }

    .sidebar-nav .app-sub-sidebar ul {
      margin: 0 !important;
      padding: 0 !important;
      border-left: 0 !important;
    }

    .sidebar-nav .app-sub-sidebar li {
      display: block !important;
      margin: 0 !important;
      padding: 0 !important;
      position: static !important;
    }

    .sidebar-nav li.sidebar-page-branch.is-collapsed > .app-sub-sidebar,
    .sidebar-nav li.sidebar-page-branch.is-collapsed > p > .app-sub-sidebar {
      display: none !important;
    }

    .sidebar-nav .app-sub-sidebar li a {
      display: block !important;
      width: 100% !important;
      box-sizing: border-box !important;
      margin-left: 0 !important;
      min-height: 26px !important;
      padding: 3px 8px 3px 12px !important;
      color: #766b61 !important;
      font-size: 13px !important;
      line-height: 1.5 !important;
      left: auto !important;
      transform: none !important;
    }

    .sidebar::-webkit-scrollbar {
      width: 8px;
    }

    .sidebar::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: #d7cdbb;
    }

    /* 手机端字号不缩 */
    @media (max-width: 768px) {
      .markdown-section {
        font-size: 17px !important;
      }

      .article-cover-list {
        gap: 0;
      }

      .article-cover-group {
        margin: 20px 0 28px;
      }

      .article-cover-group h2 {
        font-size: 18px;
      }

      .article-cover-row {
        grid-template-columns: 86px minmax(0, 1fr);
        gap: 10px;
        padding: 9px 0;
      }

      .article-cover-thumb,
      .article-cover-thumb img {
        width: 86px;
      }

      .article-cover-info strong {
        font-size: 14px;
      }

      .article-cover-head {
        flex-direction: column;
        gap: 5px;
      }

      .article-cover-info em {
        font-size: 12px;
      }

      .article-cover-excerpt {
        margin-top: 4px;
        font-size: 13px;
        line-height: 1.55;
      }

      .article-cover-actions {
        justify-content: flex-start;
        flex-basis: auto;
        gap: 4px;
      }

      .article-cover-actions a {
        min-height: 20px;
        padding: 1px 6px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: '旧日之书',
      repo: 'https://github.com/z-waterking/MyBook_OldDays',
      loadSidebar: 'website/_sidebar.md',
      loadNavbar: false,
      homepage: 'website/catalog.md',
      subMaxLevel: 2,
      search: {
        placeholder: '搜索文章...',
        noData: '没有找到结果',
        depth: 3
      },
      auto2top: true,
      plugins: [
        function hideFrontMatter(hook) {
          hook.beforeEach(function (content) {
            return content.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n+/, '');
          });
        },
        function enhanceSidebar(hook) {
          var branchStateKey = 'old-days-sidebar-branches';

          function readBranchState() {
            try {
              return JSON.parse(localStorage.getItem(branchStateKey) || '{}');
            } catch (error) {
              return {};
            }
          }

          function writeBranchState(state) {
            localStorage.setItem(branchStateKey, JSON.stringify(state));
          }

          function normalizeHash(value) {
            return String(value || '')
              .replace(/^#/, '#')
              .replace(/\?id=.*$/, '')
              .replace(/\.md$/, '')
              .replace(/\/$/, '');
          }

          function setCollapsed(item, collapsed) {
            item.classList.toggle('is-collapsed', collapsed);
            item.classList.toggle('is-expanded', !collapsed);
            var toggle = item.querySelector(':scope > p.sidebar-branch-toggle');
            if (toggle) toggle.setAttribute('aria-expanded', String(!collapsed));
          }

          function setupStaticBranches() {
            var state = readBranchState();
            document.querySelectorAll('.sidebar-nav > ul > li').forEach(function (item, index) {
              var label = item.querySelector(':scope > p > strong');
              var panel = item.querySelector(':scope > ul');
              if (!label || !panel) return;

              var toggle = label.parentElement;
              var key = label.textContent.trim() || 'branch-' + index;
              var hasActiveChild = Boolean(panel.querySelector('li.active, a.active'));
              var collapsed = Object.prototype.hasOwnProperty.call(state, key) ? state[key] : !hasActiveChild;

              item.classList.add('sidebar-branch');
              if (key === '维护') item.classList.add('sidebar-maintenance');
              toggle.classList.add('sidebar-branch-toggle');
              toggle.setAttribute('role', 'button');
              toggle.setAttribute('tabindex', '0');
              setCollapsed(item, collapsed);

              toggle.onclick = function (event) {
                event.preventDefault();
                event.stopPropagation();
                var nextCollapsed = !item.classList.contains('is-collapsed');
                state[key] = nextCollapsed;
                writeBranchState(state);
                setCollapsed(item, nextCollapsed);
              };
              toggle.onkeydown = function (event) {
                if (event.key === 'Enter' || event.key === ' ') {
                  toggle.click();
                }
              };
            });
          }

          function setupPageBranches() {
            document.querySelectorAll('.sidebar-nav li').forEach(function (item) {
              var panel = item.querySelector(':scope > ul.app-sub-sidebar, :scope > p > ul.app-sub-sidebar');
              var link = item.querySelector(':scope > a, :scope > p > a');
              if (!panel || !link) return;

              item.classList.add('sidebar-page-branch', 'is-expanded');
              panel.querySelectorAll('li').forEach(function (listItem) {
                Array.from(listItem.childNodes).forEach(function (node) {
                  if (node.nodeType === Node.TEXT_NODE && node.textContent.trim() === '-') {
                    node.remove();
                  }
                });
              });
              link.onclick = function (event) {
                var targetHash = normalizeHash(link.getAttribute('href'));
                var currentHash = normalizeHash(window.location.hash || '#/');
                if (targetHash && targetHash === currentHash) {
                  event.preventDefault();
                  event.stopPropagation();
                  item.classList.toggle('is-collapsed');
                  item.classList.toggle('is-expanded');
                }
              };
            });
          }

          function setupSidebar() {
            setupStaticBranches();
            setupPageBranches();
          }

          hook.doneEach(setupSidebar);
        }
      ],
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
