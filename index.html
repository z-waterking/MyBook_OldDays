<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>旧日之书</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="从小城少年到互联网打工人，三十八篇文章记录地方、学校、工作、关系与选择如何塑造一个普通人。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="旧日之书">
  <meta property="og:description" content="那些旧日确实发生过，而现在的我，也确实是从那里走来的。">
  <meta property="og:image" content="https://z-waterking.github.io/MyBook_OldDays/assets/images/_generated/home-hero.webp">
  <meta property="og:url" content="https://z-waterking.github.io/MyBook_OldDays/">
  <link rel="canonical" href="https://z-waterking.github.io/MyBook_OldDays/">
  <link rel="icon" type="image/png" href="assets/images/_generated/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #5a4a3a;
    }

    body {
      background: #fafaf8;
      color: #2d2d2d;
    }

    .skip-link {
      position: fixed;
      z-index: 2000;
      top: 8px;
      left: 8px;
      min-height: 38px;
      padding: 0 14px;
      border: 2px solid #5a4a3a;
      border-radius: 4px;
      background: #fffdf8;
      color: #3e3328;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      transform: translateY(-150%);
    }

    .skip-link:focus-visible {
      transform: translateY(0);
    }

    :where(a, button, input, select, summary, [tabindex]):focus-visible {
      outline: 3px solid #a66338 !important;
      outline-offset: 3px !important;
    }

    /* 正文 */
    .markdown-section {
      max-width: 860px !important;
      font-size: 18px !important;
      line-height: 2 !important;
      color: #2d2d2d !important;
    }

    .markdown-section p {
      margin: 0 0 1.3em;
    }

    /* 标题 */
    .markdown-section h1 {
      font-size: 2em !important;
      font-weight: 700 !important;
      margin: 1em 0 0.6em !important;
      padding-bottom: 12px !important;
      border-bottom: 2px solid #e0ddd8 !important;
    }

    .markdown-section h2 {
      font-size: 1.5em !important;
      font-weight: 600 !important;
      margin: 2em 0 0.7em !important;
      padding-bottom: 8px !important;
      border-bottom: 1px solid #e8e6e2 !important;
    }

    .markdown-section h3 {
      font-size: 1.2em !important;
      font-weight: 600 !important;
      margin: 1.6em 0 0.5em !important;
    }

    /* 链接 */
    .markdown-section a {
      color: #5a4a3a !important;
      text-decoration: underline !important;
      text-underline-offset: 3px;
    }

    .markdown-section a:hover {
      color: #8b6914 !important;
    }

    /* 引用块 — 简洁卡片 */
    .markdown-section blockquote {
      background: #f4f2ee !important;
      border: none !important;
      border-left: 3px solid #c0b89e !important;
      border-radius: 0 6px 6px 0 !important;
      padding: 20px 24px !important;
      margin: 1.4em 0 !important;
      font-size: 17px !important;
      line-height: 1.9 !important;
    }

    .markdown-section blockquote p {
      margin: 0 0 0.5em !important;
      color: #3a3a3a !important;
    }

    .markdown-section blockquote p:last-child {
      margin-bottom: 0 !important;
    }

    /* 分割线 */
    .markdown-section hr {
      border: none !important;
      border-top: 1px solid #e0ddd8 !important;
      margin: 2.5em 0 !important;
    }

    /* 表格 */
    .markdown-section table {
      font-size: 16px !important;
    }

    .markdown-section table thead th {
      background: #f0eeea !important;
      font-weight: 600 !important;
    }

    .markdown-section table tbody tr:hover {
      background: #f7f6f3 !important;
    }

    /* 图片 */
    .markdown-section img {
      border-radius: 4px;
      max-width: 100%;
    }

    .markdown-section .article-cover {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      margin: 12px 0 28px;
      border-radius: 6px;
    }

    /* 首页 */
    .markdown-section:has(.book-home) {
      max-width: 1080px !important;
      padding-top: 32px !important;
    }

    .book-home {
      letter-spacing: 0;
    }

    .book-home-hero {
      position: relative;
      display: flex;
      min-height: 520px;
      align-items: flex-end;
      overflow: hidden;
      border-radius: 6px;
      background: #20221d;
      color: #fff;
    }

    .book-home-hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0 !important;
      object-fit: cover;
      object-position: center;
      border-radius: 0 !important;
    }

    .book-home-hero::after {
      position: absolute;
      inset: 0;
      content: "";
      background: linear-gradient(90deg, rgba(19, 19, 16, 0.78) 0%, rgba(19, 19, 16, 0.42) 48%, rgba(19, 19, 16, 0.04) 78%);
      pointer-events: none;
    }

    .book-home-hero-copy {
      position: relative;
      z-index: 1;
      width: min(650px, 72%);
      padding: 42px 46px 44px;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8);
    }

    .book-home-kicker,
    .book-home-section-label {
      margin: 0 0 8px !important;
      color: #8b6914;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0 !important;
    }

    .book-home-kicker {
      color: #fff7dd;
    }

    .book-home h1 {
      margin: 0 0 14px !important;
      padding: 0 !important;
      border: 0 !important;
      color: #fff !important;
      font-family: "STKaiti", "KaiTi", "FangSong", serif;
      font-size: 58px !important;
      font-weight: 700 !important;
      line-height: 1.08 !important;
      letter-spacing: 0 !important;
    }

    .book-home-lead {
      max-width: 560px;
      margin: 0 !important;
      color: #fff !important;
      font-family: "STKaiti", "KaiTi", "FangSong", serif;
      font-size: 22px;
      line-height: 1.7;
    }

    .book-home-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .book-home-actions a {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      padding: 0 15px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 4px;
      color: #fff !important;
      background: rgba(28, 28, 24, 0.42);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none !important;
      text-shadow: none;
    }

    .book-home-actions a:hover,
    .book-home-actions .book-home-primary {
      border-color: #fff;
      background: #fff;
      color: #2d261d !important;
    }

    .book-home-intro {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 42px;
      padding: 48px 34px 28px;
      border-bottom: 1px solid #e5dfd4;
    }

    .book-home-intro p {
      margin: 0 !important;
      color: #49433b;
      font-size: 17px;
      line-height: 1.9;
    }

    .book-home-path,
    .book-home-featured,
    .book-home-map-feature,
    .book-home-explore {
      margin-top: 58px;
    }

    .book-home-timeline {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      margin-top: 16px;
      border-top: 1px solid #dcd4c6;
      border-bottom: 1px solid #dcd4c6;
    }

    .book-home-timeline a {
      display: block;
      min-width: 0;
      padding: 18px 14px 20px;
      border-right: 1px solid #e8e2d8;
      color: #332d26 !important;
      text-decoration: none !important;
    }

    .book-home-timeline a:last-child {
      border-right: 0;
    }

    .book-home-timeline a:hover {
      background: #f3f0e9;
    }

    .book-home-timeline span,
    .book-home-timeline small,
    .book-home-timeline strong {
      display: block;
    }

    .book-home-timeline span {
      color: #a38d6d;
      font-size: 12px;
      font-weight: 700;
    }

    .book-home-timeline strong {
      margin-top: 5px;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.4;
    }

    .book-home-timeline small {
      margin-top: 4px;
      color: #83786c;
      font-size: 12px;
      line-height: 1.45;
    }

    .book-home-section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid #dcd4c6;
    }

    .book-home-section-head h2 {
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      font-size: 25px !important;
    }

    .book-home-section-head > a {
      color: #6c5c47 !important;
      font-size: 13px;
      text-decoration: none !important;
    }

    .book-home-featured-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .book-home-feature {
      display: grid;
      grid-template-columns: 152px minmax(0, 1fr);
      min-height: 118px;
      overflow: hidden;
      border: 1px solid #e2dcd1;
      border-radius: 6px;
      background: #fff;
      color: inherit !important;
      text-decoration: none !important;
    }

    .book-home-feature:hover {
      border-color: #c2b49c;
    }

    .book-home-feature img {
      width: 152px;
      height: 100%;
      min-height: 118px;
      margin: 0 !important;
      object-fit: cover;
      border-radius: 0 !important;
    }

    .book-home-feature span {
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: center;
      padding: 15px 17px;
    }

    .book-home-feature small,
    .book-home-feature strong,
    .book-home-feature em {
      display: block;
      letter-spacing: 0;
    }

    .book-home-feature small {
      color: #94764b;
      font-size: 11px;
      font-weight: 700;
      font-style: normal;
    }

    .book-home-feature strong {
      margin-top: 4px;
      color: #2d2924;
      font-size: 15px;
      line-height: 1.45;
    }

    .book-home-feature em {
      margin-top: 5px;
      color: #746d65;
      font-size: 12px;
      font-style: normal;
      line-height: 1.55;
    }

    .book-home-feature-wide {
      grid-column: 1 / -1;
      grid-template-columns: 270px minmax(0, 1fr);
      min-height: 170px;
    }

    .book-home-feature-wide img {
      width: 270px;
      min-height: 170px;
    }

    .book-home-feature-wide strong {
      font-size: 20px;
    }

    .book-home-map-feature {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
      overflow: hidden;
      border-top: 1px solid #d8cfbf;
      border-bottom: 1px solid #d8cfbf;
      background: #f4f1ea;
    }

    .book-home-map-feature > img {
      width: 100%;
      height: 100%;
      min-height: 330px;
      margin: 0 !important;
      object-fit: cover;
      border-radius: 0 !important;
    }

    .book-home-map-feature > div {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 32px 34px;
    }

    .book-home-map-feature h2 {
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      color: #332d26;
      font-size: 27px !important;
    }

    .book-home-map-feature > div > p:not(.book-home-section-label):not(.book-home-map-stats) {
      margin: 14px 0 0 !important;
      color: #665e55;
      font-size: 14px;
      line-height: 1.75;
    }

    .book-home-map-stats {
      display: flex;
      gap: 20px;
      margin: 20px 0 0 !important;
      color: #7d7165;
      font-size: 12px;
    }

    .book-home-map-stats strong {
      margin-right: 4px;
      color: #3b3229;
      font-size: 20px;
    }

    .book-home-map-feature > div > a {
      align-self: flex-start;
      margin-top: 22px;
      padding: 7px 12px;
      border: 1px solid #7a6549;
      border-radius: 4px;
      color: #5e4b34 !important;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none !important;
    }

    .book-home-map-feature > div > a:hover {
      background: #6d5a42;
      color: #fff !important;
    }

    .book-home-quote {
      margin: 64px 0 0;
      padding: 42px 20px;
      border-top: 1px solid #dcd4c6;
      border-bottom: 1px solid #dcd4c6;
      text-align: center;
    }

    .book-home-quote p {
      margin: 0 !important;
      color: #332d26;
      font-family: "STKaiti", "KaiTi", "FangSong", serif;
      font-size: 27px;
      line-height: 1.7;
    }

    .book-home-quote a {
      display: inline-block;
      margin-top: 12px;
      color: #826b4b !important;
      font-size: 13px;
      text-decoration: none !important;
    }

    .book-home-explore {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0;
      margin-bottom: 46px;
      border-top: 1px solid #dcd4c6;
      border-bottom: 1px solid #dcd4c6;
    }

    .book-home-explore a {
      display: block;
      min-width: 0;
      padding: 22px 20px;
      border-right: 1px solid #e2dcd1;
      color: #2d2924 !important;
      text-decoration: none !important;
    }

    .book-home-explore a:last-child {
      border-right: 0;
    }

    .book-home-explore a:hover {
      background: #f3f0e9;
    }

    .book-home-explore small,
    .book-home-explore strong {
      display: block;
    }

    .book-home-explore small {
      color: #92764e;
      font-size: 12px;
    }

    .book-home-explore strong {
      margin-top: 5px;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.45;
    }

    /* 成书阅读 */
    .markdown-section.book-index-page,
    .markdown-section.book-part-page {
      max-width: 900px !important;
    }

    .book-part-page > h1,
    .book-index-page > h1 {
      color: #3b332b;
      font-family: "STKaiti", "KaiTi", "FangSong", serif;
    }

    .book-part-page > blockquote:first-of-type {
      margin-top: 0 !important;
      padding: 9px 0 9px 16px !important;
      border-left-color: #9d8462 !important;
      background: transparent !important;
      color: #766754 !important;
      font-size: 14px !important;
    }

    .book-part-progress {
      margin: -6px 0 30px !important;
      color: #927b5c;
      font-size: 13px;
      font-weight: 700;
    }

    .book-reading-context {
      margin: 0 0 30px;
      padding: 13px 0 12px;
      border-top: 1px solid #d8cfbf;
      border-bottom: 1px solid #d8cfbf;
    }

    .book-reading-context-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .book-reading-context a {
      color: #6b563c !important;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none !important;
    }

    .book-reading-context span {
      color: #8d8275;
      font-size: 12px;
    }

    .book-reading-progress-track {
      height: 3px;
      margin-top: 10px;
      overflow: hidden;
      background: #e9e3d9;
    }

    .book-reading-progress-value {
      display: block;
      height: 100%;
      background: #8a6d49;
    }

    .book-chapter-nav {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin: 54px 0 18px;
      border-top: 1px solid #d8cfbf;
      border-bottom: 1px solid #d8cfbf;
    }

    .book-chapter-nav a {
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: center;
      padding: 17px 18px;
      color: #332d26 !important;
      text-decoration: none !important;
    }

    .book-chapter-nav a + a {
      border-left: 1px solid #e3ddd3;
      text-align: right;
    }

    .book-chapter-nav a:hover {
      background: #f4f1ea;
    }

    .book-chapter-nav small,
    .book-chapter-nav strong {
      display: block;
      overflow-wrap: anywhere;
    }

    .book-chapter-nav small {
      color: #9a8364;
      font-size: 11px;
      font-weight: 700;
    }

    .book-chapter-nav strong {
      margin-top: 4px;
      font-size: 14px;
      line-height: 1.45;
    }

    /* 足迹地图 */
    .markdown-section:has(.footprints-page) {
      max-width: 1120px !important;
    }

    .footprints-page {
      --map-blue-900: #123f66;
      --map-blue-700: #1f6299;
      --map-blue-600: #2f75b5;
      --map-blue-500: #3388ff;
      --map-blue-200: #a7cbe8;
      --map-blue-100: #e8f3fb;
      margin-top: 24px;
    }

    .footprints-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-top: 1px solid var(--map-blue-200);
      border-bottom: 1px solid var(--map-blue-200);
    }

    .footprints-summary span {
      padding: 17px 18px;
      border-right: 1px solid #d8e7f2;
      color: #58748a;
      font-size: 13px;
      text-align: center;
    }

    .footprints-summary span:last-child {
      border-right: 0;
    }

    .footprints-summary strong {
      margin-right: 5px;
      color: var(--map-blue-700);
      font-size: 21px;
    }

    .footprints-tabs {
      display: flex;
      gap: 8px;
      margin: 26px 0 12px;
    }

    .footprints-tabs button {
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid var(--map-blue-200);
      border-radius: 4px;
      background: #f7fbff;
      color: var(--map-blue-700);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }

    .footprints-tabs button.is-active {
      border-color: var(--map-blue-600);
      background: var(--map-blue-600);
      color: #fff;
    }

    .footprints-tabs button:not(:disabled):not(.is-active):hover {
      border-color: var(--map-blue-600);
      background: var(--map-blue-100);
    }

    .footprints-tabs button:disabled {
      cursor: wait;
      opacity: 0.58;
    }

    .footprints-map-shell {
      position: relative;
    }

    .footprints-map {
      width: 100%;
      height: 620px;
      overflow: hidden;
      border: 1px solid var(--map-blue-200);
      border-radius: 6px;
      background: var(--map-blue-100);
    }

    .footprints-map-hint {
      position: absolute;
      z-index: 500;
      top: 14px;
      right: 14px;
      margin: 0 !important;
      padding: 7px 10px;
      border: 1px solid rgba(47, 117, 181, 0.34);
      border-radius: 4px;
      background: rgba(247, 251, 255, 0.94);
      box-shadow: 0 3px 12px rgba(31, 98, 153, 0.16);
      color: var(--map-blue-900);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      pointer-events: none;
    }

    .footprints-map-note {
      margin: 8px 0 0 !important;
      color: #5d7891;
      font-size: 12px;
    }

    .footprints-map-status {
      display: grid;
      min-height: 100%;
      place-items: center;
      margin: 0 !important;
      padding: 24px;
      color: #466a89;
      font-size: 14px;
      text-align: center;
    }

    .footprints-marker {
      width: 14px;
      height: 14px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: var(--map-blue-500);
      box-shadow: 0 1px 6px rgba(18, 63, 102, 0.46);
    }

    .footprints-marker[data-kind="life"] { background: #0f4c81; }
    .footprints-marker[data-kind="study"] { background: #1e6fb1; }
    .footprints-marker[data-kind="work"] { background: #2f86c1; }
    .footprints-marker[data-kind="choice"] { background: #5b8fc5; }
    .footprints-marker[data-kind="travel"] { background: #168aad; }
    .footprints-marker[data-kind="transit"] { background: #7aa7c7; }

    .footprints-map .leaflet-control-zoom a {
      color: var(--map-blue-700);
    }

    .footprints-map .leaflet-control-zoom,
    .footprints-map .leaflet-control-layers {
      border-color: rgba(47, 117, 181, 0.32);
    }

    .leaflet-popup-content-wrapper {
      border: 1px solid #c5d9e8;
      border-radius: 5px;
      box-shadow: 0 5px 20px rgba(18, 63, 102, 0.22);
    }

    .footprints-popup strong,
    .footprints-popup small,
    .footprints-popup span,
    .footprints-popup a {
      display: block;
    }

    .footprints-popup strong {
      color: var(--map-blue-900);
      font-size: 14px;
    }

    .footprints-popup small {
      margin-top: 2px;
      color: #617b91;
    }

    .footprints-popup span {
      margin-top: 6px;
      color: #3f566a;
      line-height: 1.55;
    }

    .footprints-popup a {
      margin-top: 7px;
      color: #1d6fa5 !important;
    }

    .footprints-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 15px;
      margin-top: 16px;
      color: #526f88;
      font-size: 12px;
    }

    .footprints-legend span::before {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 6px;
      border-radius: 50%;

        right: 10px;
        max-width: 165px;
        font-size: 11px;
      }

      .footprints-list {
        grid-template-columns: 1fr;
      }

      .footprints-list-head {
        align-items: flex-start;
      }

      .footprints-item {
        grid-template-columns: 74px minmax(0, 1fr);
      }

      .section-illustration {
        margin: 12px 0 18px;
      }

      .curated-section-nav {
        top: 8px;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        margin: 14px 0 22px;
        padding: 8px;
      }

      .curated-section-nav-label {
        display: none;
      }

      .curated-section-nav select {
        font-size: 16px;
      }

      .back-to-top {
        right: 14px;
        bottom: 14px;
      }
    }
  </style>
</head>
<body>
  <button class="skip-link" type="button">跳到正文</button>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: '旧日之书',
      repo: 'https://github.com/z-waterking/MyBook_OldDays',
      loadSidebar: 'website/_sidebar.md',
      alias: {
        '/.*/website/_sidebar.md': '/website/_sidebar.md'
      },
      loadNavbar: false,
      homepage: 'website/home.md',
      subMaxLevel: 2,
      search: {
        placeholder: '搜索文章...',
        noData: '没有找到结果',
        depth: 3
      },
      auto2top: true,
      plugins: [
        function enhanceAccessibility(hook) {
          hook.doneEach(function () {
            var content = document.querySelector('.content');
            if (content) {
              content.id = 'main-content';
              content.setAttribute('tabindex', '-1');
            }
            var search = document.querySelector('.search input');
            if (search) search.setAttribute('aria-label', '搜索站内文章');
          });
        },
        function hideFrontMatter(hook) {
          hook.beforeEach(function (content) {
            return content.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n+/, '');
          });
        },
        function keepHomepageTitle(hook) {
          hook.doneEach(function () {
            if (!window.location.hash || window.location.hash === '#/') {
              document.title = '旧日之书';
            }
          });
        },
        function addCuratedSectionNav(hook) {
          var syncCurrentSection;

          hook.doneEach(function () {
            if (syncCurrentSection) {
              window.removeEventListener('scroll', syncCurrentSection);
              syncCurrentSection = null;
            }

            var route = window.location.hash;
            var isLiteraryGems = route.indexOf('/website/literary-gems') !== -1;
            var isFunRankings = route.indexOf('/website/fun-rankings') !== -1;
            if (!isLiteraryGems && !isFunRankings) return;

            var content = document.querySelector('.markdown-section');
            if (!content) return;
            var headings = Array.from(content.querySelectorAll('h2'));
            if (headings.length < 2) return;

            var nav = document.createElement('nav');
            nav.className = 'curated-section-nav';
            nav.setAttribute('aria-label', isLiteraryGems ? '佳句篇章导航' : '趣味榜单导航');

            var label = document.createElement('span');
            label.className = 'curated-section-nav-label';
            label.textContent = isLiteraryGems ? '佳句篇章' : '趣味榜单';

            var select = document.createElement('select');
            select.setAttribute('aria-label', label.textContent);
            headings.forEach(function (heading, index) {
              if (!heading.id) heading.id = 'curated-section-' + (index + 1);
              var option = document.createElement('option');
              option.value = heading.id;
              option.textContent = heading.textContent.replace(/\s+/g, ' ').trim();
              select.appendChild(option);
            });

            var count = document.createElement('span');
            count.className = 'curated-section-nav-count';
            count.textContent = headings.length + (isLiteraryGems ? ' 个主题' : ' 个榜单');

            nav.appendChild(label);
            nav.appendChild(select);
            nav.appendChild(count);
            headings[0].before(nav);

            select.onchange = function () {
              var target = document.getElementById(select.value);
              if (!target) return;
              var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
              target.scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block: 'start' });
              var baseHash = window.location.hash.replace(/\?id=.*$/, '');
              window.history.replaceState(null, '', baseHash + '?id=' + encodeURIComponent(target.id));
            };

            syncCurrentSection = function () {
              var current = headings[0];
              headings.forEach(function (heading) {
                if (heading.getBoundingClientRect().top <= 110) current = heading;
              });
              if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 8) {
                current = headings[headings.length - 1];
              }
              if (select.value !== current.id) select.value = current.id;
            };
            window.addEventListener('scroll', syncCurrentSection, { passive: true });
            syncCurrentSection();
          });
        },
        function renderFootprints(hook) {
          var footprintMap;
          var leafletPromise;

          function loadResource(element, parent) {
            return new Promise(function (resolve, reject) {
              element.onload = resolve;
              element.onerror = function () { reject(new Error('无法加载 ' + (element.href || element.src))); };
              parent.appendChild(element);
            });
          }

          function loadLeaflet() {
            if (window.L) return Promise.resolve(window.L);
            if (leafletPromise) return leafletPromise;

            var stylesheet = document.createElement('link');
            stylesheet.id = 'leaflet-styles';
            stylesheet.rel = 'stylesheet';
            stylesheet.href = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';

            var script = document.createElement('script');
            script.id = 'leaflet-script';
            script.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';

            var resources = Promise.all([
              loadResource(stylesheet, document.head),
              loadResource(script, document.body)
            ]).then(function () {
              if (!window.L) throw new Error('Leaflet 初始化失败');
              return window.L;
            });

            var timeout = new Promise(function (_, reject) {
              setTimeout(function () { reject(new Error('Leaflet 加载超时')); }, 10000);
            });

            leafletPromise = Promise.race([resources, timeout]).catch(function (error) {
              document.getElementById('leaflet-styles')?.remove();
              document.getElementById('leaflet-script')?.remove();
              leafletPromise = null;
              throw error;
            });
            return leafletPromise;
          }

          function escapeHtml(value) {
            return String(value || '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;');
          }

          function markerIcon(kind) {
            return L.divIcon({
              className: '',
              html: '<div class="footprints-marker" data-kind="' + escapeHtml(kind) + '"></div>',
              iconSize: [18, 18],
              iconAnchor: [9, 9],
              popupAnchor: [0, -10]
            });
          }

          function articleHref(path) {
            if (!path || path === 'website/footprints.md') return '#/';
            return '#/' + encodeURI(path).replace(/#/g, '%23');
          }

          function popupHtml(item) {
            return '<div class="footprints-popup">' +
              '<strong>' + escapeHtml(item.name) + '</strong>' +
              '<small>' + escapeHtml(item.status) + ' · ' + escapeHtml(item.period) + '</small>' +
              '<span>' + escapeHtml(item.story) + '</span>' +
              '<a href="' + articleHref(item.article) + '">阅读来源</a>' +
              '</div>';
          }

          function renderList(container, items, filter) {
            var visible = filter === 'all' ? items : items.filter(function (item) { return item.kind === filter; });
            container.innerHTML = visible.map(function (item) {
              return '<article class="footprints-item">' +
                '<div class="footprints-item-meta"><small>' + escapeHtml(item.status) + '</small><strong>' + escapeHtml(item.name) + '</strong></div>' +
                '<div><p>' + escapeHtml(item.story) + '</p><a href="' + articleHref(item.article) + '">来源文章</a></div>' +
                '</article>';
            }).join('');
          }

          hook.doneEach(function () {
            if (footprintMap) {
              footprintMap.remove();
              footprintMap = null;
            }
            var page = document.querySelector('.footprints-page');
            if (!page) return;
            var mapElement = document.getElementById('footprints-map');
            var listElement = document.getElementById('footprints-list');
            var filterElement = document.getElementById('footprints-filter');
            var staticIndex = document.getElementById('footprints-static-index');

            function showMapStatus(message) {
              mapElement.innerHTML = '<p class="footprints-map-status" role="status">' + escapeHtml(message) + '</p>';
              mapElement.setAttribute('aria-busy', 'false');
            }

            fetch(page.dataset.source)
              .then(function (response) {
                if (!response.ok) throw new Error('Footprint data HTTP ' + response.status);
                return response.json();
              })
              .then(function (data) {
                if (!document.body.contains(page)) return;
                var currentScope = 'china';
                var layers = [];

                function showScope(scope) {
                  currentScope = scope;
                  var items = data[scope];
                  filterElement.value = 'all';
                  renderList(listElement, items, 'all');
                  listElement.setAttribute('aria-busy', 'false');
                  document.querySelectorAll('[data-map-tab]').forEach(function (button) {
                    var active = button.dataset.mapTab === scope;
                    button.classList.toggle('is-active', active);
                    button.setAttribute('aria-pressed', String(active));
                  });
                  if (!footprintMap) return;

                  layers.forEach(function (layer) { footprintMap.removeLayer(layer); });
                  layers = [];
                  items.forEach(function (item) {
                    var marker = L.marker([item.lat, item.lng], { icon: markerIcon(item.kind) })
                      .bindPopup(popupHtml(item))
                      .addTo(footprintMap);
                    layers.push(marker);
                  });
                  var route = scope === 'china' ? data.routes.china : data.routes.spain;
                  if (route && route.length) {
                    var line = L.polyline(route, {
                      color: '#2f75b5',
                      weight: 3,
                      opacity: 0.78,
                      dashArray: '6 7'
                    }).addTo(footprintMap);
                    layers.push(line);
                  }
                  var bounds = L.latLngBounds(items.map(function (item) { return [item.lat, item.lng]; }));
                  footprintMap.fitBounds(bounds, { padding: [28, 28], maxZoom: scope === 'china' ? 5 : 4 });
                  setTimeout(function () { footprintMap.invalidateSize(); }, 0);
                }

                document.querySelectorAll('[data-map-tab]').forEach(function (button) {
                  button.disabled = false;
                  button.onclick = function () { showScope(button.dataset.mapTab); };
                });
                filterElement.disabled = false;
                filterElement.onchange = function () {
                  renderList(listElement, data[currentScope], filterElement.value);
                };
                showScope('china');

                loadLeaflet()
                  .then(function () {
                    if (!document.body.contains(page)) return;
                    mapElement.innerHTML = '';
                    footprintMap = L.map(mapElement, { scrollWheelZoom: false, zoomControl: true });
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                      maxZoom: 18,
                      attribution: 'Tiles &copy; Esri'
                    }).addTo(footprintMap);
                    mapElement.setAttribute('aria-busy', 'false');
                    showScope(currentScope);
                  })
                  .catch(function (error) {
                    if (document.body.contains(page)) {
                      showMapStatus('地图暂时无法加载，地点档案仍可正常阅读。');
                    }
                    console.warn(error);
                  });
              })
              .catch(function (error) {
                showMapStatus('地点数据暂时无法加载，请使用下方静态地点索引。');
                listElement.innerHTML = '<p class="footprints-map-status" role="status">动态地点档案暂时不可用。</p>';
                listElement.setAttribute('aria-busy', 'false');
                filterElement.disabled = true;
                if (staticIndex) {
                  staticIndex.open = true;
                  staticIndex.classList.add('is-fallback');
                }
                console.error(error);
              });
          });
        },
        function enhanceBookReading(hook) {
          var manifestPromise;

          function loadManifest() {
            if (!manifestPromise) {
              manifestPromise = fetch('book/reading-order.json')
                .then(function (response) {
                  if (!response.ok) throw new Error('成书阅读顺序 HTTP ' + response.status);
                  return response.json();
                })
                .catch(function (error) {
                  manifestPromise = null;
                  throw error;
                });
            }
            return manifestPromise;
          }

          function routeKey(value) {
            var route = String(value || '').replace(/^#\/?/, '').split('?')[0];
            try {
              route = decodeURI(route);
            } catch (error) {
              // Keep malformed routes comparable without interrupting reading.
            }
            return route.replace(/\.md$/, '').replace(/\/$/, '');
          }

          function routeHref(path) {
            var normalized = path;
            try {
              normalized = decodeURI(path);
            } catch (error) {
              // Preserve the original manifest path when decoding fails.
            }
            return '#/' + encodeURI(normalized);
          }

          function createChapterLink(entry, direction) {
            var link = document.createElement('a');
            var label = document.createElement('small');
            var title = document.createElement('strong');
            if (entry) {
              link.href = routeHref(entry.path);
              label.textContent = direction === 'previous' ? '上一篇' : '下一篇';
              title.textContent = entry.title;
            } else {
              link.href = '#/book/01-成书目录.md';
              label.textContent = direction === 'previous' ? '回到' : '读完';
              title.textContent = '《旧日之书》阅读目录';
            }
            link.appendChild(label);
            link.appendChild(title);
            return link;
          }

          hook.doneEach(function () {
            var content = document.querySelector('.markdown-section');
            if (!content) return;

            content.classList.remove('book-index-page', 'book-part-page', 'book-chapter-page');
            content.querySelectorAll('.book-reading-context, .book-chapter-nav, .book-part-progress').forEach(function (element) {
              element.remove();
            });

            var currentRoute = routeKey(window.location.hash);
            if (currentRoute === routeKey('book/01-成书目录.md')) {
              content.classList.add('book-index-page');
            }

            loadManifest().then(function (manifest) {
              if (currentRoute !== routeKey(window.location.hash)) return;
              var parts = manifest.parts || [];
              var currentPart = parts.find(function (part) {
                return routeKey(part.page) === currentRoute;
              });

              if (currentPart) {
                content.classList.add('book-part-page');
                var heading = content.querySelector('h1');
                if (heading) {
                  var partProgress = document.createElement('p');
                  partProgress.className = 'book-part-progress';
                  partProgress.textContent = currentPart.number + ' · ' + currentPart.chapters.length + ' 篇入选文章';
                  heading.insertAdjacentElement('afterend', partProgress);
                }
              }

              var chapters = [];
              parts.forEach(function (part) {
                (part.chapters || []).forEach(function (chapter) {
                  chapters.push({
                    title: chapter.title,
                    path: chapter.path,
                    part: part
                  });
                });
              });
              var chapterIndex = chapters.findIndex(function (chapter) {
                return routeKey(chapter.path) === currentRoute;
              });
              if (chapterIndex < 0) return;

              content.classList.add('book-chapter-page');
              var chapter = chapters[chapterIndex];
              var context = document.createElement('nav');
              context.className = 'book-reading-context';
              context.setAttribute('aria-label', '成书阅读进度');

              var contextRow = document.createElement('div');
              contextRow.className = 'book-reading-context-row';
              var partLink = document.createElement('a');
              partLink.href = routeHref(chapter.part.page);
              partLink.textContent = chapter.part.number + ' · ' + chapter.part.title;
              var counter = document.createElement('span');
              counter.textContent = '全书第 ' + (chapterIndex + 1) + ' / ' + chapters.length + ' 篇';
              contextRow.appendChild(partLink);
              contextRow.appendChild(counter);

              var progressTrack = document.createElement('div');
              progressTrack.className = 'book-reading-progress-track';
              progressTrack.setAttribute('aria-hidden', 'true');
              var progressValue = document.createElement('span');
              progressValue.className = 'book-reading-progress-value';
              progressValue.style.width = ((chapterIndex + 1) / chapters.length * 100).toFixed(2) + '%';
              progressTrack.appendChild(progressValue);
              context.appendChild(contextRow);
              context.appendChild(progressTrack);

              var firstHeading = content.querySelector('h1');
              if (firstHeading) firstHeading.before(context);

              var chapterNav = document.createElement('nav');
              chapterNav.className = 'book-chapter-nav';
              chapterNav.setAttribute('aria-label', '上一篇和下一篇');
              chapterNav.appendChild(createChapterLink(chapters[chapterIndex - 1], 'previous'));
              chapterNav.appendChild(createChapterLink(chapters[chapterIndex + 1], 'next'));
              content.appendChild(chapterNav);
            }).catch(function (error) {
              console.warn('成书阅读导航未加载', error);
            });
          });
        },
        function enhanceSidebar(hook) {
          var branchStateKey = 'old-days-sidebar-branches';

          function readBranchState() {
            try {
              return JSON.parse(localStorage.getItem(branchStateKey) || '{}');
            } catch (error) {
              return {};
            }
          }

          function writeBranchState(state) {
            localStorage.setItem(branchStateKey, JSON.stringify(state));
          }

          function normalizeHash(value) {
            var normalized = String(value || '');
            try {
              normalized = decodeURI(normalized);
            } catch (error) {
            }
            return normalized
              .replace(/^#/, '#')
              .replace(/\?id=.*$/, '')
              .replace(/\.md$/, '')
              .replace(/\/$/, '');
          }

          function ensureToggleMark(container, className) {
            var mark = container.querySelector(':scope > .' + className);
            if (!mark) {
              mark = document.createElement('span');
              mark.className = 'sidebar-toggle-mark ' + className;
              mark.setAttribute('aria-hidden', 'true');
              container.appendChild(mark);
            }
            return mark;
          }

          function updateToggleMark(container, collapsed, className) {
            ensureToggleMark(container, className).textContent = collapsed ? '▸' : '▾';
          }

          function isKnownPageBranch(link) {
            var branchTargets = [
              '#/book/README',
              '#/book/01-成书目录',
              '#/website/ranking',
              '#/website/literary-gems',
              '#/website/fun-rankings'
            ];
            return branchTargets.indexOf(normalizeHash(link.getAttribute('href'))) !== -1;
          }

          function setCollapsed(item, collapsed) {
            item.classList.toggle('is-collapsed', collapsed);
            item.classList.toggle('is-expanded', !collapsed);
            var toggle = item.querySelector(':scope > p.sidebar-branch-toggle');
            if (toggle) {
              toggle.setAttribute('aria-expanded', String(!collapsed));
              updateToggleMark(toggle, collapsed, 'sidebar-branch-mark');
            }
          }

          function setupStaticBranches() {
            var state = readBranchState();
            var collectionBranches = [];
            document.querySelectorAll('.sidebar-nav > ul > li').forEach(function (item, index) {
              var label = item.querySelector(':scope > p > strong');
              var panel = item.querySelector(':scope > ul');
              if (!label || !panel) return;

              var toggle = label.parentElement;
              var key = label.textContent.trim() || 'branch-' + index;
              var hasActiveChild = Boolean(panel.querySelector('li.active, a.active'));
              var collapsed = Object.prototype.hasOwnProperty.call(state, key) ? state[key] : !hasActiveChild;

              item.classList.add('sidebar-branch');
              if (key === '维护') item.classList.add('sidebar-maintenance');
              if (key.indexOf('合集 ·') === 0) {
                item.classList.add('sidebar-collection');
                collectionBranches.push(item);
              }
              toggle.classList.add('sidebar-branch-toggle');
              toggle.setAttribute('role', 'button');
              toggle.setAttribute('tabindex', '0');
              setCollapsed(item, collapsed);

              toggle.onclick = function (event) {
                event.preventDefault();
                event.stopPropagation();
                var nextCollapsed = !item.classList.contains('is-collapsed');
                state[key] = nextCollapsed;
                writeBranchState(state);
                setCollapsed(item, nextCollapsed);
              };
              toggle.onkeydown = function (event) {
                if (event.key === 'Enter' || event.key === ' ') {
                  toggle.click();
                }
              };
            });
            collectionBranches.forEach(function (item) {
              item.classList.remove('sidebar-collection-start', 'sidebar-collection-end');
            });
            if (collectionBranches.length) {
              collectionBranches[0].classList.add('sidebar-collection-start');
              collectionBranches[collectionBranches.length - 1].classList.add('sidebar-collection-end');
            }
          }

          function setupPageBranches() {
            document.querySelectorAll('.sidebar-nav li').forEach(function (item) {
              var panel = item.querySelector(':scope > ul.app-sub-sidebar, :scope > p > ul.app-sub-sidebar');
              var link = item.querySelector(':scope > a, :scope > p > a');
              if (!link) return;
              if (link.closest('.app-sub-sidebar')) return;
              var knownPageBranch = isKnownPageBranch(link);
              if (!panel && !knownPageBranch) return;

              item.classList.add('sidebar-page-branch');
              item.classList.toggle('is-expanded', Boolean(panel));
              item.classList.toggle('is-collapsed', !panel);
              updateToggleMark(link, !panel, 'sidebar-page-branch-mark');
              if (panel) {
                panel.querySelectorAll('li').forEach(function (listItem) {
                  Array.from(listItem.childNodes).forEach(function (node) {
                    if (node.nodeType === Node.TEXT_NODE && node.textContent.trim() === '-') {
                      node.remove();
                    }
                  });
                });
              }
              link.onclick = function (event) {
                var targetHash = normalizeHash(link.getAttribute('href'));
                var currentHash = normalizeHash(window.location.hash || '#/');
                if (panel && targetHash && targetHash === currentHash) {
                  event.preventDefault();
                  event.stopPropagation();
                  item.classList.toggle('is-collapsed');
                  item.classList.toggle('is-expanded');
                  updateToggleMark(link, item.classList.contains('is-collapsed'), 'sidebar-page-branch-mark');
                }
              };
            });
          }

          function setupSidebar() {
            setupStaticBranches();
            setupPageBranches();
            document.querySelectorAll('.sidebar-nav a[href*="website/footprints"]').forEach(function (link) {
              link.classList.add('sidebar-feature-link');
            });
          }

          hook.doneEach(setupSidebar);
        }
      ],
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <button class="back-to-top" type="button" aria-label="回到顶部" title="回到顶部">↑</button>
  <script>
    (function setupPageUtilities() {
      var skipLink = document.querySelector('.skip-link');
      var button = document.querySelector('.back-to-top');
      skipLink.addEventListener('click', function () {
        var content = document.getElementById('main-content');
        if (content) content.focus();
      });
      function sync() {
        button.classList.toggle('is-visible', window.scrollY > 700);
      }
      button.addEventListener('click', function () {
        var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.scrollTo({ top: 0, behavior: reducedMotion ? 'auto' : 'smooth' });
      });
      window.addEventListener('scroll', sync, { passive: true });
      sync();
    }());
  </script>
</body>
</html>
