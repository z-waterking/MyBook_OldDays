<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>旧日之书</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #5a4a3a;
    }

    body {
      background: #fafaf8;
      color: #2d2d2d;
    }

    /* 正文 */
    .markdown-section {
      max-width: 860px !important;
      font-size: 18px !important;
      line-height: 2 !important;
      color: #2d2d2d !important;
    }

    .markdown-section p {
      margin: 0 0 1.3em;
    }

    /* 标题 */
    .markdown-section h1 {
      font-size: 2em !important;
      font-weight: 700 !important;
      margin: 1em 0 0.6em !important;
      padding-bottom: 12px !important;
      border-bottom: 2px solid #e0ddd8 !important;
    }

    .markdown-section h2 {
      font-size: 1.5em !important;
      font-weight: 600 !important;
      margin: 2em 0 0.7em !important;
      padding-bottom: 8px !important;
      border-bottom: 1px solid #e8e6e2 !important;
    }

    .markdown-section h3 {
      font-size: 1.2em !important;
      font-weight: 600 !important;
      margin: 1.6em 0 0.5em !important;
    }

    /* 链接 */
    .markdown-section a {
      color: #5a4a3a !important;
      text-decoration: underline !important;
      text-underline-offset: 3px;
    }

    .markdown-section a:hover {
      color: #8b6914 !important;
    }

    /* 引用块 — 简洁卡片 */
    .markdown-section blockquote {
      background: #f4f2ee !important;
      border: none !important;
      border-left: 3px solid #c0b89e !important;
      border-radius: 0 6px 6px 0 !important;
      padding: 20px 24px !important;
      margin: 1.4em 0 !important;
      font-size: 17px !important;
      line-height: 1.9 !important;
    }

    .markdown-section blockquote p {
      margin: 0 0 0.5em !important;
      color: #3a3a3a !important;
    }

    .markdown-section blockquote p:last-child {
      margin-bottom: 0 !important;
    }

    /* 分割线 */
    .markdown-section hr {
      border: none !important;
      border-top: 1px solid #e0ddd8 !important;
      margin: 2.5em 0 !important;
    }

    /* 表格 */
    .markdown-section table {
      font-size: 16px !important;
    }

    .markdown-section table thead th {
      background: #f0eeea !important;
      font-weight: 600 !important;
    }

    .markdown-section table tbody tr:hover {
      background: #f7f6f3 !important;
    }

    /* 图片 */
    .markdown-section img {
      border-radius: 4px;
      max-width: 100%;
    }

    .markdown-section .article-cover {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      margin: 12px 0 28px;
      border-radius: 6px;
    }

    .article-cover-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
      margin: 20px 0 32px;
    }

    .article-cover-card {
      display: block;
      color: inherit !important;
      text-decoration: none !important;
    }

    .article-cover-card img {
      width: 100%;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      border-radius: 6px;
      display: block;
      margin: 0 0 8px;
      background: #eeeae2;
    }

    .article-cover-meta {
      display: block;
      min-height: 54px;
    }

    .article-cover-meta strong {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 600;
      color: #2d2d2d;
    }

    .article-cover-meta em {
      display: block;
      margin-top: 2px;
      font-size: 13px;
      font-style: normal;
      color: #777;
    }

    /* 侧边栏 */
    .sidebar {
      background: #f5f4f1 !important;
      border-right: 1px solid #e8e6e2 !important;
    }

    .sidebar li > a {
      color: #555 !important;
      font-size: 14px !important;
    }

    .sidebar li > a:hover,
    .sidebar li.active > a {
      color: #2d2d2d !important;
      font-weight: 600 !important;
    }

    /* 手机端字号不缩 */
    @media (max-width: 768px) {
      .markdown-section {
        font-size: 17px !important;
      }

      .article-cover-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .article-cover-meta strong {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: '旧日之书',
      repo: 'https://github.com/z-waterking/MyBook_OldDays',
      loadSidebar: true,
      loadNavbar: false,
      homepage: 'catalog.md',
      subMaxLevel: 2,
      search: {
        placeholder: '搜索文章...',
        noData: '没有找到结果',
        depth: 3
      },
      auto2top: true,
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
